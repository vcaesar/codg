# Codg Desktop — Wails 3 build configuration.
# When you update `info` or `fileAssociations`, run `wails3 task common:update:build-assets` to update the assets.
version: "3"

info:
  companyName: "Atom AI"
  productName: "Codg"
  productIdentifier: "com.atomai.codg"
  description: "AI-powered coding assistant"
  copyright: "(c) 2025-2026, Atom AI"
  comments: "Terminal-native AI coding assistant with desktop shell"
  version: "0.20.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  frontend_devserver_url: "http://localhost:5176"
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
      - v0
      - .v0
      - .codg
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary

fileAssociations:

other:
