# Publish desktop packages on normal v<semver> tags, alongside the CLI assets.
# Legacy desktop-v<semver> tags and manual retries remain supported.
name: Release desktop

on:
  push:
    # Digit after the v keeps unrelated tags (e.g. vscode-*) from starting a
    # run that prepare would reject.
    tags: ["v[0-9]*", "desktop-v[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v1.2.0 or desktop-v1.2.0)"
        required: true
        type: string

permissions:
  contents: write # create the release and upload artifacts

concurrency:
  group: release-desktop-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# The desktop shell launches the standalone `codg` binary at runtime, so each
# package bundles it as a sibling. It is downloaded from the PUBLIC codg
# releases (no GitHub token needed).
env:
  CODG_RELEASE_REPO: "vcaesar/codg"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      backend_tag: ${{ steps.ver.outputs.backend_tag }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - name: Resolve version
        id: ver
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in
            desktop-v*) version="${TAG#desktop-v}" ;;
            v*) version="${TAG#v}" ;;
            *) echo "tag must look like vX.Y.Z or desktop-vX.Y.Z, got '$TAG'" >&2; exit 1 ;;
          esac
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid desktop version: $version" >&2
            exit 1
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "backend_tag=v$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.name }})
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon runner also cross-compiles the amd64 slice
          # natively (CGO darwin->darwin works), so one mac runner
          # covers both arches.
          - { runner: macos-14, platform: darwin/arm64, name: darwin-arm64 }
          - { runner: macos-14, platform: darwin/amd64, name: darwin-amd64 }
          - {
              runner: windows-latest,
              platform: windows/amd64,
              name: windows-amd64,
            }
          # Wails on Windows (WebView2 via go-webview2) needs no CGO, so the
          # amd64 runner cross-compiles the arm64 shell; NSIS emits an
          # ARM64-only installer from the same project.nsi.
          - {
              runner: windows-latest,
              platform: windows/arm64,
              name: windows-arm64,
            }
          - { runner: ubuntu-22.04, platform: linux/amd64, name: linux-amd64 }
          - {
              runner: ubuntu-22.04-arm,
              platform: linux/arm64,
              name: linux-arm64,
            }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash # desktop-release.sh is bash; windows defaults to pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          # Only the wails shell (and the shared pub module it depends on) is
          # compiled here; codg itself is a prebuilt download.
          go-version-file: ui/desktop/wails2/go.mod
          cache: true
          cache-dependency-path: ui/desktop/wails2/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Linux: Wails v2 is built with the webkit2_41 tag configured in
      # wails.json, matching Ubuntu 22.04's WebKitGTK 4.1 packages.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev libwebkit2gtk-4.1-dev

      # Windows: NSIS provides makensis for the windows:package task.
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> "$GITHUB_PATH"

      # macOS: create-dmg for the pretty drag-to-install layout
      # (hdiutil fallback exists, but this is cheap).
      - name: Install create-dmg
        if: runner.os == 'macOS'
        run: brew install create-dmg

      # Keep the CLI on the same Wails version the shell's go.mod builds with.
      - name: Install Wails v2 CLI
        working-directory: ui/desktop/wails2
        run: |
          version="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
          go install "github.com/wailsapp/wails/v2/cmd/wails@${version}"

      # Download the matching codg CLI from the PUBLIC codg releases so the
      # packager can bundle it next to the shell. No token: public release
      # assets are fetched over plain HTTPS.
      - name: Fetch codg binary
        env:
          PLATFORM: ${{ matrix.platform }}
          BACKEND_TAG: ${{ needs.prepare.outputs.backend_tag }}
        run: |
          set -euo pipefail
          if [ -z "${CODG_RELEASE_REPO}" ]; then
            echo "CODG_RELEASE_REPO unset; skipping codg download" >&2
            exit 0
          fi
          os="${PLATFORM%/*}"; arch="${PLATFORM#*/}"
          base="codg_${os}_${arch}"
          bin="$base"; [ "$os" = "windows" ] && bin="${bin}.exe"
          asset="${base}.zip"
          url="https://github.com/${CODG_RELEASE_REPO}/releases/download/${BACKEND_TAG}/${asset}"
          mkdir -p .codg-bin
          # A v* tag can start this build before the matching CLI asset is
          # uploaded. Retry 404s too; curl --retry alone does not retry them.
          for attempt in {1..30}; do
            if curl -fSL --connect-timeout 10 --max-time 120 -o ".codg-bin/${asset}" "$url"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "CLI asset unavailable after 30 attempts: $url" >&2
              exit 1
            fi
            echo "Waiting for matching CLI asset ($attempt/30): $url" >&2
            sleep 30
          done
          # The zip holds a single binary named like the asset (sans .zip);
          # extract and resolve it. unzip (-o overwrite, -j flatten) where
          # available; Git Bash on the Windows runner has no unzip and its
          # `tar` is GNU tar (cannot read zip), but 7-Zip is preinstalled.
          if command -v unzip >/dev/null 2>&1; then
            unzip -o -j ".codg-bin/${asset}" -d .codg-bin
          elif command -v 7z >/dev/null 2>&1; then
            7z x -y -o.codg-bin ".codg-bin/${asset}"
          else
            echo "neither unzip nor 7z available to extract ${asset}" >&2
            exit 1
          fi
          if [ ! -f ".codg-bin/${bin}" ]; then
            echo "expected ${bin} inside ${asset}; archive contents:" >&2
            ls -la .codg-bin >&2
            exit 1
          fi
          chmod +x ".codg-bin/${bin}" || true
          echo "CODG_PREBUILT_BIN=$PWD/.codg-bin/${bin}" >> "$GITHUB_ENV"

      - name: Build and package
        env:
          # The binary embeds the web UI from ui/desktop/pub/frontend/dist
          # (pub/assets.go); desktop-release.sh syncs it, building ui/web from
          # source when present. The UI's API calls go to the bundled
          # `codg web`, so a missing codg binary is a hard failure rather than
          # a silent PATH-fallback. desktop-release.sh honours this flag.
          CODG_REQUIRE_BUNDLE: "1"
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/desktop-release.sh "$PLATFORM" "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          # codg-desktop-* are the shell packages (required); codg-<os>-<arch>
          # is the optional standalone CLI shipped alongside.
          path: |
            dist/codg-desktop-*
            dist/codg-${{ matrix.name }}*
          if-no-files-found: error

  publish:
    name: publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          # Do not overwrite the CLI release's checksum manifest.
          sha256sum codg-* > desktop-checksums.txt
          cat desktop-checksums.txt

      # Re-runs (e.g. one platform retried) must not fail on an existing
      # release: upload into it with --clobber instead.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            args=()
            if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
            gh release create "$TAG" dist/* \
              --verify-tag --latest=false \
              --title "Codg Desktop $TAG" \
              --generate-notes "${args[@]}"
          fi
