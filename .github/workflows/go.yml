name: Go
on: [push]
jobs:
  test:
    # name: build
    strategy:
      matrix:
        # go: [1.12.x, 1.13.x]
        os: [macOS-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # scripts tests exec bash; on Windows this puts Git Bash first in PATH.
        shell: bash

    steps:
      - name: Set up Go 1.27.0
        uses: actions/setup-go@v6
        with:
          go-version: 1.27.x
        id: go

      - name: Check out code into the Go module directory
        uses: actions/checkout@v6

      - name: Get dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test -v ./scripts
      # plugin/ is a separate module (plugin/go.mod).
      - name: Test plugin
        working-directory: plugin
        run: go vet ./... && go test -v ./...
        # run: go test -v .
